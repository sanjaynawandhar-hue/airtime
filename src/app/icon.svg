<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Airtime</title>
  <desc>The tick strip from DESIGN.md, read as a broadcast leader and as film perforations, with the live dot in flare. Drawn rather than photographed so it stays legible at 16px in a browser tab.</desc>
  <rect width="64" height="64" rx="12" fill="#0b0221" />
  <g fill="#f4f1fe">
    <rect x="10" y="16" width="4" height="14" rx="1" />
    <rect x="18" y="12" width="4" height="22" rx="1" />
    <rect x="26" y="18" width="4" height="10" rx="1" />
    <rect x="34" y="10" width="4" height="26" rx="1" />
    <rect x="42" y="20" width="4" height="6" rx="1" />
  </g>
  <g fill="#945900">
    <rect x="10" y="42" width="4" height="4" rx="1" />
    <rect x="18" y="42" width="4" height="4" rx="1" />
    <rect x="26" y="42" width="4" height="4" rx="1" />
    <rect x="34" y="42" width="4" height="4" rx="1" />
    <rect x="42" y="42" width="4" height="4" rx="1" />
  </g>
  <circle cx="52" cy="20" r="5" fill="#cc0d53" />
</svg>
